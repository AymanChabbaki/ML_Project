name: Deploy FastAPI to Azure

on:
  push:
    branches:
      - main
    # ONLY trigger this workflow if files inside the tox-api folder change
    paths:
      - 'tox-api/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # This acts like a global 'cd tox-api' for all run commands in this job
    defaults:
      run:
        working-directory: ./tox-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force LFS Pull
        run: git lfs pull

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: toxapiayman.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Verify Model File Sizes
        run: ls -lh tox-api/tox21_production_models || ls -lh tox21_production_models

      - name: Build and Push Docker Image
        # Because of the 'defaults' above, this runs safely inside the tox-api folder
        run: |
          docker build -t toxapiayman.azurecr.io/tox-backend:latest .
          docker push toxapiayman.azurecr.io/tox-backend:latest

      - name: Deploy to Azure Container Instances
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az container create \
              --resource-group tox-api-rg-italy \
              --name tox-api-container \
              --image toxapiayman.azurecr.io/tox-backend:latest \
              --registry-username ${{ secrets.ACR_USERNAME }} \
              --registry-password ${{ secrets.ACR_PASSWORD }} \
              --dns-name-label tox-api-ayman \
              --ports 7860 \
              --os-type Linux \
              --cpu 1 \
              --memory 1.5 \
              --location italynorth