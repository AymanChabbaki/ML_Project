version: '3.8'

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8010:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TOX21_MODELS_DIR: /app/tox21_production_models
    volumes:
      - ./tox21_production_models:/app/tox21_production_models
    expose:
      - "8000"
    restart: always